description: 'POST /api/progress/sync y DELETE /api/progress/enrollments/{courseId} (backend/docs/api-progreso.md). Envía antes, en la carpeta «Cursos · Publicación», el inicio de sesión de la autora y «Publicar curso (201)»: las peticiones usan su token y el id de ese curso. En sync, mandar lo mismo varias veces deja el mismo estado (fusión = unión, gana la fecha más antigua); para probar el 400 rompe el cuerpo (por ejemplo, quita «enrollments»). En la baja, se borran la inscripción y los módulos dominados del curso (idempotente, 204); para probar el 404 cambia el id de la URL a algo que no sea UUID (por ejemplo «not-a-uuid»). En ambas, para el 401, quita la cabecera Authorization. El 413 no está aquí (un cuerpo de más de 2 MiB no cabe en el workspace).'
